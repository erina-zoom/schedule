<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ERINA Zoom 管理画面</title>

<style>
body{font-family:sans-serif;background:#f4f7f5;margin:0}
.panel{background:#fff;padding:20px;margin:20px;border-radius:10px}
.button{padding:10px 15px;border:none;border-radius:8px}
.button-primary{background:#247447;color:#fff}
.button-danger{background:#c62828;color:#fff}
.button-secondary{background:#ddd}
</style>
</head>

<body>

<h1 style="padding:20px;">ERINA Zoom 管理画面</h1>

<!-- ========================= -->
<!-- イベント一覧 -->
<!-- ========================= -->
<div class="panel">

<h2>📅 イベント一覧</h2>

<button id="newEventButton" class="button button-primary">＋新規</button>
<button id="reloadButton" class="button button-secondary">更新</button>

<div id="eventList"></div>

</div>

<!-- ========================= -->
<!-- 編集 -->
<!-- ========================= -->
<div class="panel">

<h2>✏️ 編集</h2>

<input type="hidden" id="eventId">

<input id="title" placeholder="タイトル"><br><br>

<input type="date" id="date"><br><br>

<input type="time" id="startTime"><br><br>

<input type="time" id="endTime"><br><br>

<button id="saveEventButton" class="button button-primary">保存</button>
<button id="deleteButton" class="button button-danger">削除</button>
<button id="clearButton" class="button button-secondary">クリア</button>

</div>

<!-- ========================= -->
<!-- お知らせ -->
<!-- ========================= -->
<div class="panel">

<h2>📢 お知らせ</h2>

<input id="noticeTitle" placeholder="タイトル"><br><br>
<textarea id="noticeMessage" placeholder="内容"></textarea><br><br>

<input type="date" id="noticeStart"><br><br>
<input type="date" id="noticeEnd"><br><br>

<select id="noticeEnabled">
<option value="true">表示</option>
<option value="false">非表示</option>
</select><br><br>

<button id="saveNoticeButton" class="button button-primary">保存</button>

<div id="noticeList"></div>

</div>

<script src="manager.js"></script>

<script>
// 🔥 追加（超重要）

document.getElementById("newEventButton").onclick = () => {
    clearEditor();
};

document.getElementById("reloadButton").onclick = async () => {
    await loadEvents();
    renderEvents();
};

document.getElementById("deleteButton").onclick = async () => {
    if(!editingEventId) return;

    if(!confirm("削除する？")) return;

    await fetch(WORKER_URL,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body: JSON.stringify({
            action:"deleteEvent",
            id: editingEventId
        })
    });

    alert("削除OK");

    editingEventId = null;

    await loadEvents();
    renderEvents();
};

document.getElementById("clearButton").onclick = () => {
    clearEditor();
};
</script>

</body>
</html>
