<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ERINA Zoom 管理画面</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
ERINA Zoom 管理画面
</header>

<div class="container">

<!-- 一覧 -->
<div class="section">

<h2>📅 登録済み催事</h2>

<div class="top-buttons">
<button id="newEventButton" class="add-btn">＋新しい催事を追加</button>
<button id="reloadButton" class="reload-btn">最新データを読み込む</button>
</div>

<div id="eventList"></div>

</div>


<!-- 編集 -->
<div class="section">

<h2>＋ 新しい催事を追加</h2>

<input type="hidden" id="eventId">

<label>催事名</label>
<input id="title">

<label>カレンダー用の短い名前</label>
<input id="shortTitle">

<label>カテゴリー</label>
<select id="category">
<option>その他</option>
<option>チェリー</option>
<option>FMなまず</option>
<option>理科</option>
</select>

<label>開催日</label>
<input type="date" id="eventDate">

<label>カラー</label>
<input type="color" id="eventColor" value="#247447">

<label>開始時間</label>
<input type="time" id="startTime">

<label>終了時間</label>
<input type="time" id="endTime">

<label>Zoom URL</label>
<input id="zoomUrl">

<br>

<button id="saveEventButton" class="save-btn">この催事を保存</button>
<button id="deleteButton" class="danger-btn">削除</button>
<button id="clearButton">クリア</button>

</div>


<!-- お知らせ -->
<div class="section">

<h2>📢 お知らせ</h2>

<input id="noticeTitle" placeholder="タイトル">
<textarea id="noticeMessage" placeholder="内容"></textarea>

<input type="date" id="noticeStart">
<input type="date" id="noticeEnd">

<select id="noticeEnabled">
<option value="true">表示</option>
<option value="false">非表示</option>
</select>

<button id="saveNoticeButton" class="save-btn">お知らせ保存</button>

<div id="noticeList"></div>

</div>

</div>

<script src="manager.js"></script>

</body>
</html>
