<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ERINA 管理画面</title>

<style>
body{font-family:sans-serif;margin:0;background:#f5f5f5;}
header{background:#247447;color:white;padding:15px;}
main{padding:15px;}

.panel{
background:white;
padding:15px;
border-radius:10px;
margin-bottom:15px;
}

input,select{
width:100%;
padding:8px;
margin-bottom:10px;
}

button{
padding:10px;
margin-right:5px;
}

.event-item{
border-bottom:1px solid #ddd;
padding:10px 0;
}
</style>
</head>

<body>

<header>
<h1>管理画面</h1>
</header>

<main>

<section class="panel">
<h2>催事一覧</h2>
<div id="eventList"></div>
</section>

<section class="panel">
<h2>編集</h2>

<input id="title" placeholder="タイトル">
<input id="eventDate" type="date">
<input id="startTime" type="time">

<input id="zoomUrl" placeholder="Zoom URL">

<button id="saveBtn">保存</button>
<button id="newBtn">新規</button>

</section>

</main>

<script src="manager.js"></script>
</body>
</html>
