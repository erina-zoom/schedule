<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ERINA Zoom 管理画面</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<h1 style="padding:20px;">ERINA Zoom 管理画面</h1>

<div class="panel">

<h2>📅 イベント一覧</h2>

<button id="newEventButton">＋新規</button>
<button id="reloadButton">更新</button>

<div id="eventList"></div>

</div>


<div class="panel">

<h2>✏️ 編集</h2>

<input type="hidden" id="eventId">

<input id="title" placeholder="タイトル"><br><br>

<input id="shortTitle" placeholder="短い名前"><br><br>

<select id="category">
<option>その他</option>
<option>チェリー</option>
<option>FMなまず</option>
<option>理科</option>
</select><br><br>

<input type="date" id="eventDate"><br><br>

<input type="color" id="eventColor" value="#247447"><br><br>

<input type="time" id="startTime"><br><br>

<input type="time" id="endTime"><br><br>

<input id="zoomUrl" placeholder="Zoom URL"><br><br>

<!-- 🔥 画像 -->
<h3>🖼 催事画像（チェリー・FM用）</h3>

<input type="file" id="imageInput">
<button id="uploadImageButton">画像アップロード</button>

<div id="imagePreview"></div>

<hr>

<!-- 🔥 スケジュール -->
<h3>📝 催事スケジュール（のびしろ用）</h3>

<div id="programList"></div>

<button id="addProgramButton">＋項目追加</button>

<br><br>

<button id="saveEventButton">保存</button>
<button id="deleteButton">削除</button>
<button id="clearButton">クリア</button>


<div class="panel">

<h2>📢 お知らせ</h2>

<input id="noticeTitle" placeholder="タイトル"><br><br>

<textarea id="noticeMessage" placeholder="内容"></textarea><br><br>

<input type="date" id="noticeStart"><br><br>
<input type="date" id="noticeEnd"><br><br>

<select id="noticeEnabled">
<option value="true">表示</option>
<option value="false">非表示</option>
</select><br><br>

<button id="saveNoticeButton">保存</button>

<div id="noticeList"></div>

</div>

<script src="manager.js"></script>

</body>
</html>
