<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ERINA Zoom予定表</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="logo-area">
    <img src="images/logo.png" class="logo">
    <div>
        <h1>ERINA Zoom予定表</h1>
        <p class="sub-title">最新のZoomスケジュール</p>
    </div>
</div>

<section class="card">
    <h2>📢 今日のZoom</h2>
    <div id="todayEvent">読み込み中...</div>
</section>

<section class="card">
    <h2>⏭ 次回Zoom</h2>
    <div id="nextEvent">読み込み中...</div>
</section>

<section class="card">
    <h2>📅 今週の予定</h2>
    <div id="weekEvents"></div>
</section>

<section class="card">
    <h2>📋 スケジュール表</h2>
    <div id="scheduleList"></div>
</section>

<script src="app.js"></script>

</body>
</html>
