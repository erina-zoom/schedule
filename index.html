<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ERINA Zoom予定表</title>

<link rel="stylesheet" href="./style.css">
<link rel="manifest" href="./manifest.json">

</head>

<body>

<header>

    <img src="images/logo.png" class="logo" alt="ERINA">

    <div>
        <h1>ERINA Zoom予定表</h1>
        <p class="sub-title">最新のZoomスケジュール</p>
    </div>

</header>

<main>

    <!-- 今日 -->
    <h2>📢 今日のZoom</h2>
    <div id="todayEvent">読み込み中...</div>

    <!-- 次回 -->
    <h2>⏭ 次回Zoom</h2>
    <div id="nextEvent">読み込み中...</div>

    <!-- カレンダー -->
    <div class="calendar-header">
        <button id="prevMonth">◀</button>
        <h2 id="monthTitle"></h2>
        <button id="nextMonth">▶</button>
    </div>

    <div class="week">
        <div>月</div>
        <div>火</div>
        <div>水</div>
        <div>木</div>
        <div>金</div>
        <div>土</div>
        <div>日</div>
    </div>

    <div id="calendar" class="calendar"></div>

</main>

<!-- モーダル -->
<div id="eventModal" class="modal">

    <button id="closeModal" class="close">✕</button>

    <div id="eventImageArea"></div>

    <div id="eventDetail"></div>

</div>

<!-- 🔥 これが一番重要 -->
<script src="./app.js"></script>

</body>
</html>
