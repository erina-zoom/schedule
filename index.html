<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ERINA Zoom予定表</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
    <h1>ERINA Zoom予定表</h1>

    <div class="top-buttons">
        <button id="btnList">📋 予定</button>
        <button id="btnCalendar">📅 カレンダー</button>
    </div>
</header>

<main>

<section class="card">
    <h2>📢 今日のZoom</h2>
    <div id="todayEvent"></div>
</section>

<section class="card">
    <h2>⏭ 次回のZoom</h2>
    <div id="nextEvent"></div>
</section>

<section class="card">
    <h2>📅 今週の予定</h2>
    <div id="weekEvents"></div>
</section>

</main>
<div id="calendarSection" class="card" style="display:none;">

    <div class="calendar-header">
        <button id="prevMonth">◀</button>
        <h2 id="monthTitle"></h2>
        <button id="nextMonth">▶</button>
    </div>

    <div class="calendar-grid" id="calendar"></div>

</div>
<div id="eventModal" class="modal hidden">
    <div class="modal-content">
        <button id="closeModal">✕</button>
        <div id="eventDetail"></div>
    </div>
</div>

<script src="app.js"></script>

</body>
</html>
