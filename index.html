<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ERINA Zoom予定表</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <!-- ヘッダー -->
    <header class="header">
        <img src="images/icon-192.png" class="logo">
        <div>
            <h1>ERINA Zoom予定表</h1>
            <p>最新のZoomスケジュール</p>
        </div>
    </header>

    <!-- 今日 -->
    <h2>📢 今日のZoom</h2>
    <div id="today"></div>

    <!-- 次回 -->
    <h2>⏭ 次回のZoom</h2>
    <div id="next"></div>

    <!-- 今週 -->
    <h2>📅 今週の予定</h2>
    <div id="week"></div>

</div>

<!-- モーダル -->
<div id="modal" class="modal">
    <div class="modal-box">
        <button onclick="closeModal()">✖</button>
        <div id="eventDetail"></div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
